stages:
  - test

default:
  image: node:22-alpine

# server lives in the root npm workspace; mcp and ui are standalone
# packages with their own lockfiles.
#
# Each job runs only when its own package (or this file) changed. The
# daily SEO engine pushes docs-only seo/* branches and docs/ + www/
# commits to main; running all three suites for those exhausted the
# namespace's compute quota (Sept 2026). A newly pushed branch has no
# previous commit to diff against, so branches compare to main instead.
# Web-triggered and scheduled pipelines still run every job.

server:
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &server_paths
        - server/**/*
        - package.json
        - package-lock.json
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        paths: *server_paths
        compare_to: refs/heads/main
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck --workspace=@impri/server
    - npm run lint --workspace=@impri/server
    - npm test --workspace=@impri/server
    - npm run build --workspace=@impri/server

mcp:
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &mcp_paths
        - mcp/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        paths: *mcp_paths
        compare_to: refs/heads/main
  cache:
    key:
      files:
        - mcp/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd mcp && npm ci --cache ../.npm --prefer-offline
  script:
    - npm run typecheck
    - npm run lint
    - npm test

ui:
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &ui_paths
        - ui/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        paths: *ui_paths
        compare_to: refs/heads/main
  cache:
    key:
      files:
        - ui/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd ui && npm ci --cache ../.npm --prefer-offline
  script:
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
